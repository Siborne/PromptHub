name: Quality Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.surfaces.outputs.shared }}
      desktop: ${{ steps.surfaces.outputs.desktop }}
      cli: ${{ steps.surfaces.outputs.cli }}
      mobile: ${{ steps.surfaces.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected surfaces
        id: surfaces
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/detect-ci-surfaces.mjs --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" \
              | node scripts/detect-ci-surfaces.mjs >> "$GITHUB_OUTPUT"
          fi

  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify CI configuration
        run: pnpm test:ci-config

      - name: Verify specification governance
        run: pnpm spec:test

      - name: Verify file-size limits
        run: pnpm lint:file-size

  shared-verify:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify shared package
        run: |
          pnpm --filter @prompthub/shared typecheck
          pnpm --filter @prompthub/shared test

      - name: Verify database and core packages
        run: |
          pnpm --filter @prompthub/db typecheck
          pnpm --filter @prompthub/core typecheck
          pnpm --filter @prompthub/core test

  cli-verify:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify CLI
        run: |
          pnpm --filter @prompthub/cli lint
          pnpm --filter @prompthub/cli typecheck
          pnpm --filter @prompthub/cli test
          pnpm --filter @prompthub/cli build

  mobile-verify:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify mobile
        run: |
          pnpm --filter @prompthub/mobile typecheck
          pnpm --filter @prompthub/mobile test

  desktop-verify:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Performance budget
        run: pnpm test:perf

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm --filter @prompthub/desktop bundle:budget
